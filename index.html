<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الحضور والانصراف</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; margin: 10px 0; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        .btn-primary { background-color: #28a745; color: white; }
        .btn-danger { background-color: #dc3545; color: white; }
        .btn-secondary { background-color: #007bff; color: white; }
        .dashboard { display: none; }
        #statusMessage { margin-top: 15px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

<div class="container">
    <!-- شاشة تسجيل الدخول -->
    <div id="loginSection">
        <h2>تسجيل دخول الموظف</h2>
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button class="btn-primary" onclick="login()">دخول</button>
        <div id="loginError" style="color: red; margin-top: 10px;"></div>
    </div>

    <!-- لوحة الحضور والانصراف -->
    <div id="dashboardSection" class="dashboard">
        <h2>أهلاً، <span id="userName"></span></h2>
        <p id="currentTime"></p>
        <hr>
        <button class="btn-secondary" onclick="checkIn()">تسجيل حضور</button>
        <button class="btn-danger" onclick="checkOut()">تسجيل انصراف</button>
        <div id="statusMessage"></div>
        <br>
        <button style="background: #6c757d; color: white;" onclick="logout()">خروج</button>
    </div>
</div>

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, child, get, set, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  // الكود اللي بعتهولي
  const firebaseConfig = {
    apiKey: "AIzaSyBCctS6DZYYdDBqA6mV-e5smTg-7d3-tEU",
    authDomain: "daily-report-7196f.firebaseapp.com",
    databaseURL: "https://daily-report-7196f-default-rtdb.firebaseio.com",
    projectId: "daily-report-7196f",
    storageBucket: "daily-report-7196f.firebasestorage.app",
    messagingSenderId: "760687344646",
    appId: "1:760687344646:web:03f6739ce3649bbdec1787",
    measurementId: "G-9FM68J9DHV"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  
  // تخزين بيانات المستخدم الحالي
  let currentUser = null;

  // ربط الدوال بالنافذة عشان تشتغل من أزرار HTML
  window.login = async function() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('loginError');
    errorDiv.innerText = "";

    if (!email || !password) {
        errorDiv.innerText = "من فضلك أدخل الإيميل والباسورد";
        return;
    }

    try {
        // جلب كل المستخدمين من قاعدة البيانات
        const snapshot = await get(child(ref(db), 'users'));
        if (snapshot.exists()) {
            let found = false;
            snapshot.forEach((childSnapshot) => {
                const userData = childSnapshot.val();
                const userId = childSnapshot.key;
                
                // التحقق من الإيميل والباسورد
                if (userData.email === email && userData.password === password) {
                    found = true;
                    currentUser = { id: userId, name: userData.name, role: userData.role };
                }
            });

            if (found) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                document.getElementById('userName').innerText = currentUser.name;
                updateTime();
            } else {
                errorDiv.innerText = "بيانات الدخول غير صحيحة";
            }
        } else {
            errorDiv.innerText = "لا يوجد مستخدمين مسجلين";
        }
    } catch (error) {
        console.error(error);
        errorDiv.innerText = "حدث خطأ، حاول مرة أخرى";
    }
  }

  window.checkIn = async function() {
    if (!currentUser) return;
    const now = new Date();
    const hour = now.getHours();
    const statusMessage = document.getElementById('statusMessage');

    // تنسيق التاريخ (YYYY-MM-DD)
    const today = now.toISOString().split('T')[0];

    // التحقق من وقت التسجيل (من 8 لـ 10 صباحاً)
    if (hour >= 8 && hour < 10) {
        try {
            // حفظ في جدول attendance -> رقم الموظف -> تاريخ اليوم
            await set(ref(db, 'attendance/' + currentUser.id + '/' + today), {
                checkIn: now.toLocaleTimeString(),
                status: "حضور طبيعي"
            });
            statusMessage.innerText = "✅ تم تسجيل حضورك بنجاح في الوقت المحدد";
            statusMessage.style.color = "green";
        } catch (e) { alert("خطأ في الحفظ") }
    } 
    else if (hour >= 10 && hour < 12) {
        try {
            await set(ref(db, 'attendance/' + currentUser.id + '/' + today), {
                checkIn: now.toLocaleTimeString(),
                status: "تأخير"
            });
            statusMessage.innerText = "⚠️ تم تسجيل حضورك، ولكن تم تسجيل تأخير!";
            statusMessage.style.color = "orange";
        } catch (e) { alert("خطأ في الحفظ") }
    }
    else if (hour < 8) {
        statusMessage.innerText = "الوقت مبكر جداً، ميعاد التسجيل من 8 صباحاً";
        statusMessage.style.color = "red";
    }
    else {
        statusMessage.innerText = "عذراً، انتهى وقت تسجيل الحضور. تواصل مع الإدارة";
        statusMessage.style.color = "red";
    }
  }

  window.checkOut = async function() {
    if (!currentUser) return;
    const now = new Date();
    const today = now.toISOString().split('T')[0];
    const statusMessage = document.getElementById('statusMessage');

    try {
        // تحديث وقت الانصراف
        await update(ref(db, 'attendance/' + currentUser.id + '/' + today), {
            checkOut: now.toLocaleTimeString()
        });
        statusMessage.innerText = "👋 تم تسجيل انصرافك بنجاح";
        statusMessage.style.color = "blue";
    } catch (e) { alert("خطأ في الحفظ") }
  }

  window.logout = function() {
    currentUser = null;
    document.getElementById('loginSection').style.display = 'block';
    document.getElementById('dashboardSection').style.display = 'none';
    document.getElementById('email').value = '';
    document.getElementById('password').value = '';
  }

  function updateTime() {
    setInterval(() => {
        const now = new Date();
        const timeString = now.toLocaleTimeString('ar-EG');
        document.getElementById('currentTime').innerText = "الوقت الآن: " + timeString;
    }, 1000);
  }
</script>
</body>
</html>
