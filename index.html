<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة موزنا</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; }
        .navbar { background-color: #2c3e50; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .navbar h2 { margin: 0; }
        .nav-links button { background: none; border: none; color: #ecf0f1; padding: 10px 15px; cursor: pointer; font-size: 16px; border-radius: 5px; transition: 0.3s; }
        .nav-links button:hover, .nav-links button.active { background-color: #34495e; }
        .content { padding: 20px; max-width: 1000px; margin: 20px auto; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; }
        .login-container { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn-primary { background-color: #28a745; color: white; width: 100%; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        .btn-logout { background-color: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<!-- شاشة تسجيل الدخول -->
<div id="loginSection" class="login-container">
    <div class="login-box">
        <h2>تسجيل دخول النظام</h2>
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button class="btn-primary" onclick="login()">دخول</button>
        <div id="loginError" style="color: red; margin-top: 10px;"></div>
    </div>
</div>

<!-- لوحة تحكم النظام -->
<div id="dashboardSection" style="display: none;">
    <div class="navbar">
        <h2>أهلاً، <span id="userName"></span></h2>
        <div class="nav-links">
            <button id="btn-departments" onclick="showSection('departments')">الأقسام</button>
            <button id="btn-tasks" onclick="showSection('tasks')">المهام</button>
            <button id="btn-users" onclick="showSection('users')">المستخدمين</button>
            <button id="btn-attendance" onclick="showSection('attendance')">الحضور</button>
            <button class="btn-logout" onclick="logout()">خروج</button>
        </div>
    </div>

    <div class="content">
        <!-- قسم الأقسام -->
        <div id="departmentsView" class="card">
            <h3>الأقسام</h3>
            <table>
                <tr><th>اسم القسم</th></tr>
                <tbody id="departmentsTable"></tbody>
            </table>
        </div>

        <!-- قسم المهام -->
        <div id="tasksView" class="card" style="display: none;">
            <h3>المهام</h3>
            <table>
                <tr><th>اسم المهمة</th></tr>
                <tbody id="tasksTable"></tbody>
            </table>
        </div>

        <!-- قسم المستخدمين -->
        <div id="usersView" class="card" style="display: none;">
            <h3>المستخدمين</h3>
            <table>
                <tr><th>الاسم</th><th>الإيميل</th><th>الوظيفة</th></tr>
                <tbody id="usersTable"></tbody>
            </table>
        </div>

        <!-- قسم الحضور -->
        <div id="attendanceView" class="card" style="display: none;">
            <h3>تسجيل الحضور والانصراف</h3>
            <div id="liveTimer" style="font-size: 30px; font-weight: bold; color: #007bff; margin: 10px 0;">00:00:00</div>
            <button id="toggleBtn" style="background-color: #007bff; color: white; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;" onclick="toggleAttendance()">تسجيل حضور (Time In)</button>
            <div id="statusMessage" style="margin-top: 15px; font-weight: bold; color: #333;"></div>
        </div>
    </div>
</div>

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, child, get, set, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBCctS6DZYYdDBqA6mV-e5smTg-7d3-tEU",
    authDomain: "daily-report-7196f.firebaseapp.com",
    databaseURL: "https://daily-report-7196f-default-rtdb.firebaseio.com",
    projectId: "daily-report-7196f",
    storageBucket: "daily-report-7196f.firebasestorage.app",
    messagingSenderId: "760687344646",
    appId: "1:760687344646:web:03f6739ce3649bbdec1787",
    measurementId: "G-9FM68J9DHV"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  
  let currentUser = null;
  let isCheckedIn = false;
  let checkInTime = null;
  let timerInterval = null;

  // تسجيل الدخول
  window.login = async function() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('loginError');
    errorDiv.innerText = "";

    if (!email || !password) { errorDiv.innerText = "من فضلك أدخل البيانات"; return; }

    try {
        const snapshot = await get(child(ref(db), 'users'));
        if (snapshot.exists()) {
            let found = false;
            snapshot.forEach((childSnapshot) => {
                const userData = childSnapshot.val();
                if (userData.email === email && userData.password === password) {
                    found = true;
                    currentUser = { id: childSnapshot.key, name: userData.name, role: userData.role };
                }
            });

            if (found) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                document.getElementById('userName').innerText = currentUser.name;
                
                // لو المدير: نفتحله الأقسام على طول
                if (currentUser.role === 'admin') {
                    showSection('departments');
                    loadDepartments(); // نسحب بيانات الأقسام
                } else {
                    // لو موظف: نفتحله الحضور على طول
                    showSection('attendance');
                }
            } else {
                errorDiv.innerText = "بيانات الدخول غير صحيحة";
            }
        }
    } catch (error) { errorDiv.innerText = "خطأ في الاتصال"; }
  }

  // التنقل بين صفحات اللوحة
  window.showSection = function(section) {
    document.getElementById('departmentsView').style.display = 'none';
    document.getElementById('tasksView').style.display = 'none';
    document.getElementById('usersView').style.display = 'none';
    document.getElementById('attendanceView').style.display = 'none';
    
    // تحديث الأزرار
    document.getElementById('btn-departments').classList.remove('active');
    document.getElementById('btn-tasks').classList.remove('active');
    document.getElementById('btn-users').classList.remove('active');
    document.getElementById('btn-attendance').classList.remove('active');

    if (section === 'departments') {
        document.getElementById('departmentsView').style.display = 'block';
        document.getElementById('btn-departments').classList.add('active');
        loadDepartments();
    } else if (section === 'tasks') {
        document.getElementById('tasksView').style.display = 'block';
        document.getElementById('btn-tasks').classList.add('active');
        loadTasks();
    } else if (section === 'users') {
        document.getElementById('usersView').style.display = 'block';
        document.getElementById('btn-users').classList.add('active');
        loadUsers();
    } else if (section === 'attendance') {
        document.getElementById('attendanceView').style.display = 'block';
        document.getElementById('btn-attendance').classList.add('active');
    }
  }

  // جلب بيانات الأقسام
  async function loadDepartments() {
    const tableBody = document.getElementById('departmentsTable');
    tableBody.innerHTML = '<tr><td>جاري التحميل...</td></tr>';
    try {
        const snapshot = await get(child(ref(db), 'departments'));
        tableBody.innerHTML = '';
        if (snapshot.exists()) {
            snapshot.forEach((child) => {
                const data = child.val();
                tableBody.innerHTML += `<tr><td>${data.name || data.title || child.key}</td></tr>`;
            });
        } else {
            tableBody.innerHTML = '<tr><td>لا توجد أقسام مضافة</td></tr>';
        }
    } catch (e) { tableBody.innerHTML = '<tr><td>خطأ في تحميل البيانات</td></tr>'; }
  }

  // جلب بيانات المهام
  async function loadTasks() {
    const tableBody = document.getElementById('tasksTable');
    tableBody.innerHTML = '<tr><td>جاري التحميل...</td></tr>';
    try {
        const snapshot = await get(child(ref(db), 'tasks'));
        tableBody.innerHTML = '';
        if (snapshot.exists()) {
            snapshot.forEach((child) => {
                const data = child.val();
                tableBody.innerHTML += `<tr><td>${data.name || data.title || child.key}</td></tr>`;
            });
        } else {
            tableBody.innerHTML = '<tr><td>لا توجد مهام مضافة</td></tr>';
        }
    } catch (e) { tableBody.innerHTML = '<tr><td>خطأ في تحميل البيانات</td></tr>'; }
  }

  // جلب بيانات المستخدمين
  async function loadUsers() {
    const tableBody = document.getElementById('usersTable');
    tableBody.innerHTML = '<tr><td colspan="3">جاري التحميل...</td></tr>';
    try {
        const snapshot = await get(child(ref(db), 'users'));
        tableBody.innerHTML = '';
        if (snapshot.exists()) {
            snapshot.forEach((child) => {
                const data = child.val();
                tableBody.innerHTML += `<tr><td>${data.name}</td><td>${data.email}</td><td>${data.role}</td></tr>`;
            });
        } else {
            tableBody.innerHTML = '<tr><td colspan="3">لا يوجد مستخدمين</td></tr>';
        }
    } catch (e) { tableBody.innerHTML = '<tr><td colspan="3">خطأ في تحميل البيانات</td></tr>'; }
  }

  // الحضور والانصراف (للموظفين)
  window.toggleAttendance = async function() {
    const now = new Date();
    const today = now.toISOString().split('T')[0];
    const statusMessage = document.getElementById('statusMessage');

    if (!isCheckedIn) {
        const hour = now.getHours();
        if (hour >= 8 && hour < 12) { // خففت الشرط شوية عشان نقدر نجرب
            try {
                const status = (hour >= 10) ? "تأخير" : "حضور طبيعي";
                await set(ref(db, 'attendance/' + currentUser.id + '/' + today), { checkIn: now.toLocaleTimeString('ar-EG'), status: status });
                startTimer(now);
                statusMessage.innerText = `✅ تم تسجيل الحضور (${status})`;
                statusMessage.style.color = status === "تأخير" ? "orange" : "green";
            } catch (e) { alert("خطأ") }
        } else {
            statusMessage.innerText = "الوقت غير مسموح للتسجيل";
            statusMessage.style.color = "red";
        }
    } else {
        try {
            const diffMs = now - checkInTime;
            const hours = Math.floor(diffMs / 3600000);
            const minutes = Math.floor((diffMs % 3600000) / 60000);
            const totalWorked = `${hours} ساعة و ${minutes} دقيقة`;

            await update(ref(db, 'attendance/' + currentUser.id + '/' + today), { checkOut: now.toLocaleTimeString('ar-EG'), totalHours: totalWorked });
            stopTimer();
            statusMessage.innerText = `👋 تم الانصراف. إجمالي الوقت: ${totalWorked}`;
            statusMessage.style.color = "blue";
        } catch (e) { alert("خطأ") }
    }
  }

  function startTimer(startTime) {
    isCheckedIn = true;
    checkInTime = startTime;
    const toggleBtn = document.getElementById('toggleBtn');
    toggleBtn.innerText = "تسجيل انصراف (Time Out)";
    toggleBtn.style.backgroundColor = "#dc3545";
    
    timerInterval = setInterval(() => {
        const diff = new Date() - checkInTime;
        const h = String(Math.floor(diff / 3600000)).padStart(2, '0');
        const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
        const s = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
        document.getElementById('liveTimer').innerText = `${h}:${m}:${s}`;
    }, 1000);
  }

  function stopTimer() {
    isCheckedIn = false;
    clearInterval(timerInterval);
    const toggleBtn = document.getElementById('toggleBtn');
    toggleBtn.innerText = "تسجيل حضور (Time In)";
    toggleBtn.style.backgroundColor = "#007bff";
    document.getElementById('liveTimer').innerText = "00:00:00";
  }

  window.logout = function() {
    currentUser = null;
    if(timerInterval) clearInterval(timerInterval);
    document.getElementById('loginSection').style.display = 'flex';
    document.getElementById('dashboardSection').style.display = 'none';
    document.getElementById('email').value = '';
    document.getElementById('password').value = '';
  }
</script>
</body>
</html>
