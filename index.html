<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الحضور والانصراف</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn-primary { background-color: #28a745; color: white; }
        .btn-danger { background-color: #dc3545; color: white; }
        .btn-secondary { background-color: #007bff; color: white; }
        .btn-logout { background-color: #6c757d; color: white; }
        .dashboard { display: none; }
        #statusMessage { margin-top: 15px; font-weight: bold; color: #333; min-height: 20px;}
        #liveTimer { font-size: 24px; font-weight: bold; color: #007bff; margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <!-- شاشة تسجيل الدخول -->
    <div id="loginSection">
        <h2>تسجيل دخول النظام</h2>
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button class="btn-primary" onclick="login()">دخول</button>
        <div id="loginError" style="color: red; margin-top: 10px;"></div>
    </div>

    <!-- لوحة الحضور والانصراف -->
    <div id="dashboardSection" class="dashboard">
        <h2>أهلاً، <span id="userName"></span></h2>
        <p id="currentTime" style="color: #666; font-size: 14px;"></p>
        <hr>
        
        <!-- واجهة الموظف -->
        <div id="employeeView">
            <div id="liveTimer">00:00:00</div>
            <button id="toggleBtn" class="btn-secondary" onclick="toggleAttendance()">تسجيل حضور (Time In)</button>
            <div id="statusMessage"></div>
        </div>

        <br>
        <button class="btn-logout" onclick="logout()">تسجيل خروج من الحساب</button>
    </div>
</div>

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, child, get, set, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBCctS6DZYYdDBqA6mV-e5smTg-7d3-tEU",
    authDomain: "daily-report-7196f.firebaseapp.com",
    databaseURL: "https://daily-report-7196f-default-rtdb.firebaseio.com",
    projectId: "daily-report-7196f",
    storageBucket: "daily-report-7196f.firebasestorage.app",
    messagingSenderId: "760687344646",
    appId: "1:760687344646:web:03f6739ce3649bbdec1787",
    measurementId: "G-9FM68J9DHV"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  
  let currentUser = null;
  let isCheckedIn = false;
  let checkInTime = null;
  let timerInterval = null;

  window.login = async function() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('loginError');
    errorDiv.innerText = "";

    if (!email || !password) {
        errorDiv.innerText = "من فضلك أدخل الإيميل والباسورد";
        return;
    }

    try {
        const snapshot = await get(child(ref(db), 'users'));
        if (snapshot.exists()) {
            let found = false;
            snapshot.forEach((childSnapshot) => {
                const userData = childSnapshot.val();
                const userId = childSnapshot.key;
                
                if (userData.email === email && userData.password === password) {
                    found = true;
                    currentUser = { id: userId, name: userData.name, role: userData.role };
                }
            });

            if (found) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                document.getElementById('userName').innerText = currentUser.name;
                
                // التفريق بين المدير والموظف
                if (currentUser.role === 'admin') {
                    // المدير: نقفل واجهة الموظف بالكامل، ومفيش أي رسالة تظهر
                    document.getElementById('employeeView').style.display = 'none';
                } else {
                    // الموظف: نظهرله واجهة الحضور
                    document.getElementById('employeeView').style.display = 'block';
                    resetTimerUI();
                }
                
                updateTime();
            } else {
                errorDiv.innerText = "بيانات الدخول غير صحيحة";
            }
        } else {
            errorDiv.innerText = "لا يوجد مستخدمين مسجلين";
        }
    } catch (error) {
        console.error(error);
        errorDiv.innerText = "حدث خطأ في الاتصال بقاعدة البيانات";
    }
  }

  window.toggleAttendance = async function() {
    if (!currentUser) return;
    const now = new Date();
    const today = now.toISOString().split('T')[0];
    const statusMessage = document.getElementById('statusMessage');

    if (!isCheckedIn) {
        // === تسجيل حضور ===
        const hour = now.getHours();

        if (hour >= 8 && hour < 10) {
            try {
                await set(ref(db, 'attendance/' + currentUser.id + '/' + today), {
                    checkIn: now.toLocaleTimeString('ar-EG'),
                    status: "حضور طبيعي"
                });
                startTimer(now);
                statusMessage.innerText = "✅ تم تسجيل حضورك بنجاح";
                statusMessage.style.color = "green";
            } catch (e) { alert("خطأ في الحفظ") }
        } 
        else if (hour >= 10 && hour < 12) {
            try {
                await set(ref(db, 'attendance/' + currentUser.id + '/' + today), {
                    checkIn: now.toLocaleTimeString('ar-EG'),
                    status: "تأخير"
                });
                startTimer(now);
                statusMessage.innerText = "⚠️ تم تسجيل حضورك، ولكن تم تسجيل تأخير!";
                statusMessage.style.color = "orange";
            } catch (e) { alert("خطأ في الحفظ") }
        }
        else if (hour < 8) {
            statusMessage.innerText = "الوقت مبكر جداً، ميعاد التسجيل من 8 صباحاً";
            statusMessage.style.color = "red";
        }
        else {
            statusMessage.innerText = "عذراً، انتهى وقت تسجيل الحضور. تواصل مع الإدارة";
            statusMessage.style.color = "red";
        }
    } else {
        // === تسجيل انصراف ===
        try {
            const checkOutTime = now;
            const diffMs = checkOutTime - checkInTime;
            
            const hours = Math.floor(diffMs / 3600000);
            const minutes = Math.floor((diffMs % 3600000) / 60000);
            const totalWorked = `${hours} ساعة و ${minutes} دقيقة`;

            await update(ref(db, 'attendance/' + currentUser.id + '/' + today), {
                checkOut: checkOutTime.toLocaleTimeString('ar-EG'),
                totalHours: totalWorked
            });

            stopTimer();
            statusMessage.innerText = `👋 تم تسجيل انصرافك. إجمالي وقت العمل: ${totalWorked}`;
            statusMessage.style.color = "blue";
        } catch (e) { 
            alert("خطأ في الحفظ") 
        }
    }
  }

  function startTimer(startTime) {
    isCheckedIn = true;
    checkInTime = startTime;
    const toggleBtn = document.getElementById('toggleBtn');
    toggleBtn.innerText = "تسجيل انصراف (Time Out)";
    toggleBtn.className = "btn-danger";
    
    timerInterval = setInterval(() => {
        const now = new Date();
        const diff = now - checkInTime;
        
        const h = String(Math.floor(diff / 3600000)).padStart(2, '0');
        const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
        const s = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
        
        document.getElementById('liveTimer').innerText = `${h}:${m}:${s}`;
    }, 1000);
  }

  function stopTimer() {
    isCheckedIn = false;
    clearInterval(timerInterval);
    resetTimerUI();
  }

  function resetTimerUI() {
    const toggleBtn = document.getElementById('toggleBtn');
    toggleBtn.innerText = "تسجيل حضور (Time In)";
    toggleBtn.className = "btn-secondary";
    document.getElementById('liveTimer').innerText = "00:00:00";
  }

  window.logout = function() {
    currentUser = null;
    isCheckedIn = false;
    if(timerInterval) clearInterval(timerInterval);
    document.getElementById('loginSection').style.display = 'block';
    document.getElementById('dashboardSection').style.display = 'none';
    document.getElementById('email').value = '';
    document.getElementById('password').value = '';
  }

  function updateTime() {
    setInterval(() => {
        const now = new Date();
        const timeString = now.toLocaleTimeString('ar-EG');
        document.getElementById('currentTime').innerText = "الوقت الآن: " + timeString;
    }, 1000);
  }
</script>
</body>
</html>
